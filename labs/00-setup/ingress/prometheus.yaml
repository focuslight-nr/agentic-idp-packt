# API-gateway Ingress for Prometheus, at http://prometheus.localhost.
# Serves the UI, the /graph query page, and the /api/v1 API at the native
# root path (no prefix rewrite). Applied by labs/00-setup/apply-post-lab2.sh.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/managed-by: golden-path
spec:
  ingressClassName: nginx
  rules:
    - host: prometheus.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-kube-prometheus-prometheus
                port:
                  number: 9090
