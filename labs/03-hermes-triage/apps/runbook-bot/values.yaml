image:
  repository: runbook-bot
  tag: "0.1.0"
port: 8080
serviceAccountName: runbook-bot
envFromSecrets:
  - runbook-bot-github
env:
  MAX_PRS_PER_HOUR: "5"
probes:
  enabled: false
# Only Hermes may send runbook entries.
networkPolicy:
  enabled: true
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hermes
      ports:
        - port: 8080
          protocol: TCP
resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 96Mi
